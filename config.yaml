# Home Assistant add-on definition (this repository is both an add-on repository and the add-on).
name: Airport Info
version: "0.3.1"
slug: airport_info
description: UK airport information screens — flights, NOTAMs, airspace, weather station, radio
url: https://github.com/madmonkeyfpv/Airport-Info
arch: [amd64, aarch64]   # 32-bit armv7 is deprecated by the Supervisor
startup: application
boot: auto
init: false
# Read-only Supervisor API access: lets the settings page show this machine's real LAN IP and host port.
hassio_api: true
# Write access to HA's config folder only to install the dashboard card into www/airport-info/
# (served by HA as /local/airport-info/..., same origin, so it works over https / Nabu Casa / the mobile app).
map:
  - homeassistant_config:rw
ingress: true
ingress_port: 8080
panel_icon: mdi:airplane
panel_title: Airport Info
ports:
  8080/tcp: 8765   # host port 8765 by default (8080 is often taken by other add-ons); change on the Network tab
ports_description:
  8080/tcp: Direct LAN access for TVs / kiosk browsers and the dashboard card (optional; sidebar works without it)
options:
  admin_token: ""
schema:
  admin_token: password?

        background: #30333c;
        border-color: #80858d;
      }

      @keyframes restricted-active-pulse {
        0%, 100% {
          box-shadow: inset 0 0 0 0 rgba(241,107,104,0.1);
        }
        50% {
          box-shadow: inset 0 0 0 3px rgba(241,107,104,0.42);
        }
      }

      .restricted-name {
        flex: 0 0 auto;
        font-size: clamp(14px, 1.15vw, 20px);
        font-weight: 900;
        color: #ffffff;
        overflow-wrap: anywhere;
      }

      .restricted-center {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        text-align: center;
      }

      .restricted-state {
        font-size: clamp(18px, 1.65vw, 29px);
        font-weight: 900;
        letter-spacing: 0.3px;
        line-height: 1.1;
        overflow-wrap: anywhere;
      }

      .restricted-card.cold .restricted-state {
        color: #9bd9b4;
      }

      .restricted-card.scheduled .restricted-state {
        color: #f3c875;
      }

      .restricted-card.active .restricted-state {
        color: #ff9292;
      }

      .restricted-card.unknown .restricted-state {
        color: #c4c8d0;
      }

      .restricted-subtitle {
        font-size: clamp(9px, 0.72vw, 12px);
        font-weight: 800;
        line-height: 1.25;
        color: #c6d1dd;
        overflow-wrap: anywhere;
      }

      .restricted-bottom {
        flex: 0 0 auto;
        min-width: 0;
        border-top: 1px solid rgba(255,255,255,0.18);
        padding-top: 9px;
      }

      .restricted-idle {
        text-align: center;
        padding: 11px 2px;
        font-size: clamp(10px, 0.8vw, 14px);
        font-weight: 700;
        color: #aebfcf;
        overflow-wrap: anywhere;
      }

      .schedule-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
        min-width: 0;
      }

      .schedule-cell {
        min-width: 0;
        overflow: hidden;
      }

      .schedule-label {
        margin-bottom: 5px;
        font-size: clamp(9px, 0.7vw, 12px);
        font-weight: 900;
        color: #d8b9a2;
      }

      .schedule-time {
        font-size: clamp(13px, 1.05vw, 18px);
        font-weight: 900;
        color: #ffffff;
        white-space: nowrap;
      }

      .schedule-date {
        margin-top: 3px;
        font-size: clamp(10px, 0.78vw, 13px);
        font-weight: 700;
        color: #e3e5e9;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      .schedule-zulu {
        margin-top: 4px;
        font-size: clamp(9px, 0.72vw, 12px);
        font-weight: 700;
        color: #b8c9d9;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .schedule-unavailable {
        font-size: 11px;
        color: #b7c7d8;
        overflow-wrap: anywhere;
      }

      /* ======================================
         COMBINED MOA STATUS
         ====================================== */

      .moa-combined {
        flex: 0 0 55px;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 13px;
        border-radius: 9px;
        border: 1px solid #607668;
        background: #26362f;
      }

      .moa-combined-name {
        min-width: 0;
        font-size: clamp(12px, 1vw, 17px);
        font-weight: 900;
        color: #ffffff;
        overflow-wrap: anywhere;
      }

      .moa-combined-state {
        flex: 0 0 auto;
        font-size: clamp(15px, 1.25vw, 21px);
        font-weight: 900;
        color: #9bd9b4;
      }

      .moa-combined.hot {
        background: #422327;
        border-color: #f16b68;
      }

      .moa-combined.hot .moa-combined-state {
        color: #ff9292;
      }

      .moa-combined.scheduled {
        background: #403521;
        border-color: #e3b15c;
      }

      .moa-combined.scheduled .moa-combined-state {
        color: #f3c875;
      }

      .moa-combined.unknown {
        background: #30333c;
        border-color: #80858d;
      }

      .moa-combined.unknown .moa-combined-state {
        color: #c4c8d0;
      }

      /* ======================================
         SMALLER TV / LOWER RESOLUTION
         ====================================== */

      @media (max-width: 1400px) {
        .airport-header {
          flex-basis: 70px;
          padding: 10px 16px;
        }

        .airport-layout {
          padding: 9px;
          gap: 9px;
        }

        .top-row,
        .bottom-row {
          gap: 9px;
        }

        .panel-header {
          flex-basis: 47px;
          padding: 0 12px;
        }

        .activity-content {
          padding: 8px;
        }

        .activity-grid {
          gap: 7px;
        }

        .activity-card {
          padding: 9px;
        }

        .airspace-content {
          padding: 8px;
          gap: 7px;
        }

        .restricted-grid {
          gap: 7px;
        }

        .restricted-card {
          padding: 8px;
          gap: 5px;
        }

        .moa-combined {
          flex-basis: 47px;
        }
      }

      @media (max-height: 800px) {
        .airport-header {
          flex-basis: 65px;
        }

        .airport-layout {
          grid-template-rows:
            minmax(0, 1fr)
            minmax(0, 1fr);
          padding: 8px;
          gap: 8px;
        }

        .panel-header {
          flex-basis: 43px;
        }

        .activity-card {
          gap: 4px;
        }

        .activity-bottom {
          padding-top: 5px;
        }

        .restricted-card {
          gap: 4px;
        }

        .restricted-bottom {
          padding-top: 5px;
        }

        .restricted-idle {
          padding: 5px 2px;
        }

        .schedule-label {
          margin-bottom: 2px;
        }

        .schedule-date,
        .schedule-zulu {
          margin-top: 2px;
        }

        .moa-combined {
          flex-basis: 42px;
        }
      }

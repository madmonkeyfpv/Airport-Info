# Optional Home Assistant package: exposes Airport Info data as sensors for automations
# (e.g. announce an arrival within 30 min, flash lights when a nearby danger area goes active).
# Put in /config/packages/ and enable packages in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# Change the resource URL to your server and (optionally) the airport code.
rest:
  - resource: http://homeassistant.local:8765/api/data
    # params:
    #   airport: EGSU
    scan_interval: 120
    timeout: 60
    sensor:
      - name: Airport Info Temperature
        unique_id: airport_info_temperature
        value_template: "{{ value_json.weather.temp_c if value_json.weather else none }}"
        unit_of_measurement: "°C"
        device_class: temperature
      - name: Airport Info Inbound Aircraft
        unique_id: airport_info_inbound
        value_template: "{{ value_json.flights.arrivals | length if value_json.flights else none }}"
        unit_of_measurement: aircraft
        json_attributes_path: "$.flights"
        json_attributes: [arrivals, latest_arrival]
      - name: Airport Info Expected Departures
        unique_id: airport_info_departures
        value_template: "{{ value_json.flights.departures | length if value_json.flights else none }}"
        unit_of_measurement: aircraft
        json_attributes_path: "$.flights"
        json_attributes: [departures, latest_departure]
      - name: Airport Info Next Arrival
        unique_id: airport_info_next_arrival
        device_class: timestamp
        value_template: >
          {% set a = value_json.flights.arrivals if value_json.flights else [] %}
          {{ a[0].arrival_time if a else none }}
      - name: Airport Info NOTAMs
        unique_id: airport_info_notams
        value_template: "{{ value_json.notams | length if value_json.notams is not none else none }}"
        json_attributes: [notams]
      - name: Airport Info Airspace
        unique_id: airport_info_airspace
        value_template: "{{ value_json.airspace.summary.state if value_json.airspace else 'unknown' }}"
        json_attributes_path: "$.airspace"
        json_attributes: [cards, summary]
      - name: Airport Info Nearby Traffic
        unique_id: airport_info_nearby_traffic
        # Aircraft seen by ADS-B near the airfield (within the settings' radius/ceiling); list in attributes
        value_template: "{{ value_json.traffic.aircraft | length if value_json.traffic else none }}"
        unit_of_measurement: aircraft
        json_attributes_path: "$.traffic"
        json_attributes: [aircraft]
      - name: Airport Info ATIS
        unique_id: airport_info_atis
        # Letter of the most recent text ATIS (only large airports publish one); unknown otherwise
        value_template: >
          {% set r = value_json.radio.atis.reports if value_json.radio and value_json.radio.atis else [] %}
          {{ r[0].letter if r else none }}
        json_attributes_path: "$.radio"
        json_attributes: [groups, atis]

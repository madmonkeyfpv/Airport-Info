# Airport Info dashboard view (replaces the original button-card kiosk in reference/).
# Add as a new dashboard in raw-configuration mode, or paste the view into an existing one.
# Requires the card resource:  Settings → Dashboards → ⋮ → Resources →
#   URL: http://<airport-info-server>:8080/card/airport-info-card.js   Type: JavaScript module
title: Airport Information
views:
  - title: Airport Information
    path: airport-info
    icon: mdi:airplane
    type: panel
    cards:
      - type: custom:airport-info-card
        server: http://homeassistant.local:8080   # Airport Info add-on / server URL
        # airport: EGSU                            # optional: override the server's saved airport
        full_screen: true                          # fixed full-viewport TV layout (hides HA chrome)
        view: board                                # board | weather | rotate (alternates every rotate_seconds)
  - title: Airfield Weather
    path: airfield-weather
    icon: mdi:weather-windy
    type: panel
    cards:
      - type: custom:airport-info-card
        server: http://homeassistant.local:8080
        view: weather
        full_screen: true
        # settings:                                # optional per-screen overrides
        #   theme: midnight
        #   temp_unit: C

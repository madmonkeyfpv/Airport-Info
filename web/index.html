<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08111e">
<title>Airport Information</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%237dd3fc' d='M20.56 3.91c.59.59.59 1.54 0 2.12l-3.89 3.89 2.12 9.19-1.41 1.42-3.88-7.43-3.9 3.9.36 2.47-1.07 1.06-1.76-3.18-3.19-1.77 1.06-1.08 2.5.37 3.87-3.87-7.43-3.91 1.42-1.41 9.19 2.12 3.89-3.89c.56-.58 1.56-.58 2.12 0z'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #08111e; }
  #app { position: fixed; inset: 0; }
  @media (max-width: 1000px), (orientation: portrait) and (max-width: 1200px) { #app { position: static; min-height: 100%; } }
  .boot { height: 100%; display: grid; place-items: center; color: #a9bfd4; font: 700 18px/1.4 Barlow, Arial, sans-serif; letter-spacing: .08em; text-align: center; }
  .boot b { color: #f16b68; }
  .gear { position: fixed; right: 10px; bottom: 26px; z-index: 5; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(20,34,52,.85); border: 1px solid #3a5067; color: #a9bfd4; text-decoration: none; opacity: .35; transition: opacity .2s; }
  .gear:hover, .gear:focus { opacity: 1; }
  body.kiosk .gear { display: none; }
</style>
</head>
<body>
<div id="app"><div class="boot">LOADING AIRPORT INFORMATION…</div></div>
<a class="gear" href="settings.html" title="Display settings" aria-label="Display settings">
  <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7m7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64z"/></svg>
</a>
<script type="module">
import { renderBoard, BOARD_CSS, tickClocks, autoScroll } from './board.js';
import { renderWeather, WEATHER_CSS, tickWeatherClock } from './weather.js';

const params = new URLSearchParams(location.search);
const API = (params.get('api') || '').replace(/\/$/, '');      // optional: separate API host
if (params.has('kiosk')) document.body.classList.add('kiosk');
const style = document.createElement('style'); style.textContent = BOARD_CSS + WEATHER_CSS; document.head.appendChild(style);

const app = document.getElementById('app');
let data = null, stopScroll = null, timer = null, page = 'board', rotateTimer = null;

function query() {
  const q = new URLSearchParams(params); q.delete('api'); q.delete('kiosk');
  return q.toString();
}

function render() {
  if (!data) return;
  const scroll = {};
  app.querySelectorAll('[data-panel] .aib-scroll').forEach(el => { scroll[el.closest('[data-panel]').dataset.panel] = el.scrollTop; });
  const view = data.settings?.view || 'board';
  if (view !== 'rotate') page = view === 'weather' ? 'weather' : 'board';
  app.innerHTML = page === 'weather' ? renderWeather(data) : renderBoard(data);
  app.querySelectorAll('[data-panel] .aib-scroll').forEach(el => { el.scrollTop = scroll[el.closest('[data-panel]').dataset.panel] || 0; });
  document.title = `${data.airport.icao || data.airport.iata} · Airport Information`;
  if (stopScroll) stopScroll();
  const wallDisplay = matchMedia('(min-width: 1001px) and (orientation: landscape)').matches;
  stopScroll = wallDisplay && page === 'board' ? autoScroll(app) : null;
  scheduleRotate();
}

function scheduleRotate() {
  if (data?.settings?.view !== 'rotate' || rotateTimer) return;
  rotateTimer = setTimeout(() => {
    rotateTimer = null;
    page = page === 'board' ? 'weather' : 'board';
    render();
  }, Math.max(10, Number(data.settings.rotate_seconds) || 30) * 1000);
}

async function load() {
  clearTimeout(timer);
  let wait = 60;
  try {
    const r = await fetch(`${API}/api/data?${query()}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(await r.text());
    data = await r.json();
    wait = Math.max(15, Number(data.settings?.refresh_seconds) || 60);
    render();
  } catch (e) {
    if (!data) app.innerHTML = `<div class="boot"><div><b>UNABLE TO LOAD AIRPORT DATA</b><br>${String(e.message || e).replace(/</g, '&lt;').slice(0, 200)}<br>RETRYING…</div></div>`;
    wait = 20;
  }
  timer = setTimeout(load, wait * 1000);
}

setInterval(() => { if (data) { tickClocks(app, data.settings); tickWeatherClock(app); } }, 1000);

// Keep every screen in sync with the settings page: poll a tiny fingerprint and reload the
// moment the saved settings (airport, view, units…) change, instead of waiting for the next refresh.
let checking = false;
setInterval(async () => {
  if (!data || checking || document.hidden) return;
  checking = true;
  try {
    const r = await fetch(`${API}/api/settings/version`, { cache: 'no-store' });
    if (r.ok && (await r.json()).version !== data.settings_version) { clearTimeout(rotateTimer); rotateTimer = null; await load(); }
  } catch {} finally { checking = false; }
}, 5000);
// Re-render every 30 s so "minutes remaining" and urgency colours stay current between fetches.
setInterval(() => render(), 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
load();
</script>
</body>
</html>
